name: Publish SDK to TestPyPI

on:
  push:
    tags: ['sdk-v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify tag matches sdk/pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "Tag and pyproject version differ"; exit 1; }
      - run: pip install build twine pytest httpx
      - name: Test SDK
        run: pip install ./sdk && pytest sdk/tests -q
      - run: python -m build sdk
      - run: twine check sdk/dist/*
      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --repository testpypi sdk/dist/*
