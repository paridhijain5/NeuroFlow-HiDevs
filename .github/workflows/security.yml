name: security-scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target runtime -t neuroflow-api:latest ./backend

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neuroflow-api:latest
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
