[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroflow-sdk"
version = "0.1.0"
description = "Async Python SDK for the NeuroFlow AI platform (ingest, query, stream, evaluate)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["neuroflow"]

[tool.hatch.build.targets.sdist]
include = ["neuroflow", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
