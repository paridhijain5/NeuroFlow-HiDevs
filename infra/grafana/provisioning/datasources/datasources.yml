apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: $PG_HOST
    user: $PG_USER
    secureJsonData:
      password: $PG_PASSWORD
    jsonData:
      database: $PG_DATABASE
      sslmode: disable
      postgresVersion: 1500
