# Same as prometheus.yml but scrapes an API running on your HOST (uvicorn on :8000) instead of the `api` service:
#   PROM_CONFIG=prometheus.local.yml docker compose -f docker-compose.observability.yml up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: neuroflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
