# Production stack. Run from the repo root:
#   cp infra/.env.prod.example infra/.env     # then edit the secrets
#   docker compose -f infra/docker-compose.prod.yml up --build -d
name: neuroflow            # => containers are named neuroflow-api-1, neuroflow-api-2, ...

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-neuroflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-neuroflow}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
  API_CLIENTS: ${API_CLIENTS:?set API_CLIENTS in infra/.env}
  FORWARDED_ALLOW_IPS: "*"      # trust X-Forwarded-For from the Nginx edge (real client IPs for rate limiting)
  PYTHONDONTWRITEBYTECODE: "1"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-neuroflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {memory: 2g, cpus: '2.0'}
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: {memory: 512m, cpus: '0.5'}
    restart: unless-stopped
    networks: [data]

  api:
    image: neuroflow-api:latest          # tag used by `make security-scan`
    build:
      context: ../backend
      target: runtime
    env_file: [.env]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      replicas: 2
      resources:
        limits: {memory: 1g, cpus: '1.0'}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - appdata:/app/data                # only writable path besides /tmp
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [edge, data]

  worker:
    image: neuroflow-worker:latest
    build:
      context: ../backend
      target: runtime
    command: python -m worker
    env_file: [.env]
    environment: *app-env
    healthcheck:
      disable: true                      # worker serves no HTTP; image HEALTHCHECK would always fail
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      replicas: 2
      resources:
        limits: {memory: 2g, cpus: '2.0'}   # Workers need more for ML models
    restart: unless-stopped
    volumes:
      - appdata:/app/data
    <<: *hardening
    networks: [edge, data]               # edge = outbound internet for LLM providers

  frontend:
    image: neuroflow-frontend:latest
    build:
      context: ../frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    deploy:
      resources:
        limits: {memory: 512m, cpus: '0.5'}
    restart: unless-stopped
    <<: *hardening
    networks: [edge]

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [edge]

networks:
  edge: {}                 # nginx <-> api/frontend, outbound access for workers
  data:
    internal: true         # postgres/redis are unreachable from outside and have no internet

volumes:
  pgdata:
  redisdata:
  appdata:
