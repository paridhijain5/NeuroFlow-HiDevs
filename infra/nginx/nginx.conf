worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    client_max_body_size 50m;                       # document uploads

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ---- Gzip for all (compressible) responses ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # ---- Rate limiting: 60 req/min per client IP, small burst, 429 (not default 503) ----
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_status 429;

    # ---- Upstreams ----
    # Docker DNS returns one A record per replica of `api`; nginx round-robins across them.
    # (Addresses are resolved at start-up: `docker compose restart nginx` after recreating api.)
    upstream api_backend {
        server api:8000;
        keepalive 16;
    }
    upstream frontend_app {
        server frontend:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- HTTP: health probe + ACME challenge + redirect to HTTPS ----
    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location /.well-known/acme-challenge/ {     # Let's Encrypt HTTP-01 (see infra/README.md)
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Self-signed for dev. To use Let's Encrypt, change these two paths (see infra/README.md).
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # ---- Security headers (defined once at server level so every location inherits them) ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Short max-age for dev so a self-signed localhost doesn't pin HSTS in your browser.
        # Raise to 31536000 (1 year) once you serve a real domain.
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        # Shows which replica served the request (proves load balancing). Remove if you
        # don't want internal addresses exposed.
        add_header X-Upstream-Addr $upstream_addr always;

        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '{"error":"rate_limited","reason":"too_many_requests"}';
        }

        # API: /api/health -> api:8000/health  (prefix stripped by the trailing slash)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;                 # avoid duplicates with the headers above
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;                           # LLM calls can be slow
        }

        # Frontend
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
