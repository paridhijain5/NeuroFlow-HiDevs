services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: neuroflow
      POSTGRES_USER: neuroflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "neuroflow"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      bash -c "pip install --quiet psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://neuroflow:${POSTGRES_PASSWORD}@postgres:5432/neuroflow
      --default-artifact-root /mlflow/artifacts"
    ports: ["5000:5000"]
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    depends_on: [postgres, redis, mlflow]
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OTLP_ENDPOINT: http://jaeger:4317
      MIGRATIONS_DIR: /app/migrations
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./init:/app/migrations:ro
      - uploads:/app/uploads

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: python -m worker
    depends_on: [postgres, redis]
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OTLP_ENDPOINT: http://jaeger:4317
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317"]

volumes:
  postgres_data:
  mlflow_artifacts:
  uploads:
